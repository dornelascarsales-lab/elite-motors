name: Sync Inventory

on:
  schedule:
    - cron: '0 13 * * *'  # 9 AM EDT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      # O runner já vem com Google Chrome instalado; o script usa channel 'chrome'.
      - name: Scrape Summit inventory
        run: npm run sync

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add inventory.json
          git diff --staged --quiet || git commit -m "sync: estoque da Summit $(date +'%Y-%m-%d %H:%M')"
          git push
